# HTTP → HTTPS 跳转
server {
    listen 80;
    server_name forestapi.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name forestapi.com;

    # TLS 证书 (Let's Encrypt / certbot)
    ssl_certificate /etc/letsencrypt/live/forestapi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/forestapi.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # 自定义首页（拦截根路径）
    location = / {
        root /usr/share/nginx/html/custom;
        try_files /index.html =404;
    }

    # 自定义定价页
    location = /pricing {
        root /usr/share/nginx/html/custom;
        try_files /pricing.html =404;
    }

    # 自定义关于页
    location = /about {
        root /usr/share/nginx/html/custom;
        try_files /about.html =404;
    }

    # 自定义文档首页
    location = /docs {
        root /usr/share/nginx/html/custom;
        try_files /docs.html =404;
    }

    # 自定义文档子页面 /docs/xxx → docs/xxx.html
    location ~ ^/docs/(.+)$ {
        root /usr/share/nginx/html/custom;
        try_files /docs/$1.html =404;
    }

    # 自定义首页的静态资源
    location /custom-assets/ {
        alias /usr/share/nginx/html/custom/assets/;
    }

    # 自定义首页的 CSS 文件
    location = /style.css {
        root /usr/share/nginx/html/custom;
        add_header Cache-Control "public, max-age=86400";
    }

    # 暖色主题覆盖 CSS（供 sub_filter 注入）
    location = /custom-theme.css {
        alias /usr/share/nginx/html/custom/override.css;
        add_header Cache-Control "public, max-age=86400";
    }

    # 省略 /v1 前缀的 bare API 路径自动补全（从 Caddy 搬过来）
    location ~ ^/(chat|completions|messages|embeddings|audio|images|models|moderations|responses|rerank)(/.*)?$ {
        rewrite ^(.*)$ /v1$1 last;
    }

    # API relay 路径 — 不做 sub_filter，保证流式 SSE 响应正常
    location /v1/ {
        proxy_pass http://new-api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 流式响应关键配置
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        chunked_transfer_encoding on;

        # SSE / 长连接支持
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # 静态资源 — 绕过 sub_filter，直接代理（解决 JS/CSS 加载慢的问题）
    location /assets/ {
        proxy_pass http://new-api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 允许 gzip，不做 sub_filter
        proxy_buffering on;
        proxy_cache off;
    }

    # 反向代理到 new-api（管理面板等所有其他请求）
    location / {
        proxy_pass http://new-api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 强制 upstream 返回未压缩内容，否则 sub_filter 无法替换文本
        proxy_set_header Accept-Encoding "";

        # 注入自定义暖色主题 CSS + 替换品牌名 + 首页跳转修复
        sub_filter '</head>' '<link rel="stylesheet" href="/custom-theme.css"></head>';
        sub_filter '</body>' '<script>(function(){function fixLinks(root){(root.querySelectorAll?root.querySelectorAll("a"):document.querySelectorAll("a")).forEach(function(a){var h=a.getAttribute("href");if(!h)return;if(h==="/"||h==="")a.addEventListener("click",function(e){e.preventDefault();window.location.href="/";},{once:true});if(h.indexOf("docs.newapi.pro")!==-1)a.setAttribute("href","/docs");if(h==="/token")a.setAttribute("href","/console");});}fixLinks(document);new MutationObserver(function(ms){ms.forEach(function(m){m.addedNodes.forEach(function(n){if(n.nodeType===1)fixLinks(n);});});}).observe(document.body,{childList:true,subtree:true});})();</script></body>';
        sub_filter '<title>New API</title>' '<title>Forest API</title>';
        sub_filter '"New API"' '"Forest API"';
        sub_filter 'https://docs.newapi.pro/zh' '/docs';
        sub_filter_once off;
        sub_filter_types text/html;

        # 超时配置
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # WebSocket 支持
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;
}
