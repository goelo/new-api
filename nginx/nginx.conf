server {
    listen 80;
    server_name localhost;

    # 自定义首页（拦截根路径）
    location = / {
        root /usr/share/nginx/html/custom;
        try_files /index.html =404;
    }

    # 自定义首页的静态资源
    location /custom-assets/ {
        alias /usr/share/nginx/html/custom/assets/;
    }

    # 自定义首页的 CSS 文件
    location = /style.css {
        root /usr/share/nginx/html/custom;
        add_header Cache-Control "public, max-age=86400";
    }

    # 暖色主题覆盖 CSS（供 sub_filter 注入）
    location = /custom-theme.css {
        alias /usr/share/nginx/html/custom/override.css;
        add_header Cache-Control "public, max-age=86400";
    }

    # 反向代理到官方镜像（所有其他请求）
    location / {
        proxy_pass http://new-api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 强制 upstream 返回未压缩内容，否则 sub_filter 无法替换文本
        proxy_set_header Accept-Encoding "";

        # 注入自定义暖色主题 CSS + 替换品牌名
        sub_filter '</head>' '<link rel="stylesheet" href="/custom-theme.css"></head>';
        sub_filter '<title>New API</title>' '<title>Forest API</title>';
        sub_filter '"New API"' '"Forest API"';
        sub_filter_once off;
        sub_filter_types text/html application/json;

        # AI 流式响应支持（解决 524 超时问题）
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # WebSocket 支持
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;
}
