server {
    listen 80;
    server_name forestapi.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name forestapi.com;

    ssl_certificate /etc/letsencrypt/live/forestapi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/forestapi.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 自定义静态页面
    location = / {
        root /usr/share/nginx/html/custom;
        try_files /index.html =404;
    }
    location = /pricing {
        root /usr/share/nginx/html/custom;
        try_files /pricing.html =404;
    }
    location = /about {
        root /usr/share/nginx/html/custom;
        try_files /about.html =404;
    }
    location = /docs {
        root /usr/share/nginx/html/custom;
        try_files /docs.html =404;
    }
    location ~ ^/docs/(.+)$ {
        root /usr/share/nginx/html/custom;
        try_files /docs/$1.html =404;
    }

    # 前端静态资源（长期缓存）
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 省略 /v1 前缀的 bare API 路径
    location ~ ^/(chat|completions|messages|embeddings|audio|images|models|moderations|responses|rerank)(/.*)?$ {
        rewrite ^(.*)$ /v1$1 last;
    }

    # API relay（流式，不缓冲）
    location /v1/ {
        proxy_pass http://new-api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # 后端 API
    location /api {
        proxy_pass http://new-api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # mj / pg 路径
    location ~ ^/(mj|pg)/ {
        proxy_pass http://new-api:3000;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # SPA 前端
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
